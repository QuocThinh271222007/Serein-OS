# Serein SDDM configuration drop-in.
#
# Ships as /etc/sddm.conf.d/90-serein.conf (installed by a future Apply
# step; not applied by S1). A .conf.d drop-in, not an edit of the base
# /etc/sddm.conf shipped by the sddm package — removing this one file
# fully reverts to upstream SDDM behavior.
#
# Overrides only what Serein has an opinion on. Autologin is left
# explicitly disabled: Serein never enables it, per
# docs/architecture/security-model.md.

[Theme]
Current=breeze

[Autologin]
User=
Session=
