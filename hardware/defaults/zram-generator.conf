# Serein ZRAM default policy.
#
# This is a repository artifact used for planning only (referenced by
# `serein hardware plan` and the hardware profile manifests) — it is not
# installed anywhere by S2/S2R. A future Apply step would write this
# content to /etc/systemd/zram-generator.conf.d/90-serein.conf, never
# overwriting /etc/systemd/zram-generator.conf itself (upstream/package
# territory) and never applied if an existing ZRAM implementation is
# already detected (see docs/hardware/memory-policy.md and
# serein.hardware.planner).
#
# S2R correction: `zram-fraction`/`max-zram-size` are OBSOLETE options as
# of systemd-zram-generator (verified against the real package version
# shipped in Ubuntu 26.04, 1.2.1-2 — see docs/validation/s2r/
# zram-validation.md). The current option is `zram-size`, an arithmetic
# expression over the `ram` variable. `zram-size = min(ram / 2, 4096)` is
# ALSO the tool's own documented default value (zram-generator.conf(5):
# "Defaults to min(ram / 2, 4096)") — Serein pins it explicitly here for
# self-documentation and robustness against a future upstream default
# change, not because the value itself differs from upstream.
#
# `compression-algorithm` is intentionally NOT set: the real man page
# states "If unset, none will be configured and the kernel's default
# will be used" — forcing zstd was an S2 overclaim, corrected in S2R.
# Serein defers to the kernel default until a real benchmark
# (docs/hardware/planning-and-safety.md's benchmark contract) shows a
# measured reason to pin one.
#
# `swap-priority = 100` also matches the tool's own documented default
# ("If unset, 100 is used") — pinned here explicitly for the same
# self-documentation reason as zram-size, not because Serein overrides
# upstream's choice.

[zram0]
zram-size = min(ram / 2, 4096)
swap-priority = 100
