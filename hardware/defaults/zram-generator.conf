# Serein ZRAM default policy.
#
# This is a repository artifact used for planning only (referenced by
# `serein hardware plan` and the hardware profile manifests) — it is not
# installed anywhere by S2. A future Apply step would write this content
# to /etc/systemd/zram-generator.conf.d/90-serein.conf, never overwriting
# /etc/systemd/zram-generator.conf itself (upstream/package territory) and
# never applied if an existing ZRAM implementation is already detected
# (see docs/hardware/memory-policy.md and serein.hardware.planner).
#
# Values match systemd-zram-generator's own documented defaults
# (zram-generator.conf(5)): half of RAM, capped at 4 GiB, zstd compression.
# This is a deliberate choice to follow upstream's own guidance rather
# than invent a competing ratio — see docs/hardware/memory-policy.md for
# the resulting size at each RAM tier and the reasoning.

[zram0]
zram-fraction = 0.5
max-zram-size = 4096
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
