# QA-ONLY serial boot entry template (S7.0 Section 47).
#
# This fragment is NEVER applied to the normal/default boot path. It
# exists only as a template a boot-smoke run can graft onto a *copy* of
# the extracted tree's grub.cfg, for capturing kernel/systemd serial
# output during automated QEMU validation
# (serein.distribution.bootsmoke).
#
# It is a plain, interactive live-boot entry with `console=ttyS0` added
# so kernel and systemd log lines are visible on the QEMU serial port -
# it does NOT set `autoinstall`, and it does NOT touch any disk. See
# docs/distribution/boot-validation.md for how this is used, and
# tests/test_distribution.py::TestAutoinstallSafety for the regression
# that proves the *production* boot entries never carry this or an
# autoinstall trigger by default.

menuentry "Serein Alpha (qa-serial-boot-smoke)" {
    linux   /casper/vmlinuz boot=casper console=ttyS0,115200n8 quiet ---
    initrd  /casper/initrd
}
