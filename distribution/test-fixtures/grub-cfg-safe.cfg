set timeout=10
set default=0

menuentry "Try or Install Serein OS Alpha" {
    linux   /casper/vmlinuz boot=casper quiet splash ---
    initrd  /casper/initrd
}

menuentry "Serein Alpha (qa-serial-boot-smoke)" {
    linux   /casper/vmlinuz boot=casper console=ttyS0,115200n8 quiet ---
    initrd  /casper/initrd
}

menuentry "OEM install (for manufacturers)" {
    linux   /casper/vmlinuz boot=casper only-ubiquity quiet splash ---
    initrd  /casper/initrd
}
