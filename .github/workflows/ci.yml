name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (editable, with dev dependencies)
        run: python -m pip install -e ".[dev]"

      - name: Import validation
        run: python -c "import serein; import serein.cli; print(serein.__version__)"

      - name: Run test suite
        run: python -m pytest

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy

      - name: CLI smoke test
        run: |
          serein version
          serein status
          serein doctor --json
          serein hardware probe --json
          serein profile list

      - name: Desktop CLI smoke test
        run: |
          serein desktop status
          serein desktop plan
          serein desktop plan --json | python -c "import json,sys; json.load(sys.stdin)"
          serein desktop config status
          # desktop doctor's exit code is 1 only if a FAIL check fires
          # ("Serein-managed but the component is missing" — a broken
          # install); SKIP/WARN never affect it. A stock CI runner with no
          # KDE Plasma installed and no Serein config marker present should
          # always report SKIP/WARN/PASS only, so this is expected to exit
          # 0 here — a non-zero exit means a real FAIL (or a crash), which
          # this step should NOT swallow. See
          # docs/architecture/doctor-contract.md.
          serein desktop doctor
          serein desktop doctor --json | python -c "import json,sys; json.load(sys.stdin)"

      - name: Hardware CLI smoke test
        run: |
          serein hardware probe
          serein hardware status
          serein hardware capabilities
          serein hardware capabilities --json | python -c "import json,sys; json.load(sys.stdin)"
          serein hardware plan balanced
          serein hardware plan dev
          serein hardware plan ai
          serein hardware plan battery
          serein hardware plan cyber
          serein hardware plan ai --json | python -c "import json,sys; json.load(sys.stdin)"
          # hardware doctor's exit code is 1 only on a genuine FAIL (a
          # Serein-managed component found broken); a stock CI runner with
          # no Serein hardware config applied should always exit 0 here,
          # same reasoning as the desktop doctor step above.
          serein hardware doctor
          serein hardware doctor --json | python -c "import json,sys; json.load(sys.stdin)"

      - name: Development CLI smoke test
        run: |
          serein dev status
          serein dev capabilities
          serein dev capabilities --json | python -c "import json,sys; json.load(sys.stdin)"
          serein dev plan
          serein dev plan --json | python -c "import json,sys; json.load(sys.stdin)"
          serein dev plan python
          serein dev plan node
          serein dev plan rust
          serein dev plan go
          serein dev plan cpp
          serein dev plan containers
          serein dev plan editor
          # dev doctor never FAILs merely because a tool isn't installed
          # (see docs/development/architecture.md) — a stock CI runner
          # should always exit 0 here.
          serein dev doctor
          serein dev doctor --json | python -c "import json,sys; json.load(sys.stdin)"

      - name: AI CLI smoke test
        run: |
          serein ai status
          serein ai capabilities
          serein ai capabilities --json | python -c "import json,sys; json.load(sys.stdin)"
          serein ai plan
          serein ai plan --json | python -c "import json,sys; json.load(sys.stdin)"
          serein ai plan pytorch
          serein ai plan inference
          serein ai plan containers
          serein ai plan voice
          # ai doctor never FAILs merely because no GPU/AI stack is
          # installed (see docs/ai/architecture.md) — a stock CI runner
          # with no GPU should always exit 0 here.
          serein ai doctor
          serein ai doctor --json | python -c "import json,sys; json.load(sys.stdin)"

      - name: Cyber CLI smoke test
        run: |
          serein cyber status
          serein cyber capabilities
          serein cyber capabilities --json | python -c "import json,sys; json.load(sys.stdin)"
          serein cyber plan
          serein cyber plan --json | python -c "import json,sys; json.load(sys.stdin)"
          serein cyber plan host
          serein cyber plan toolbox
          serein cyber plan vm
          # cyber doctor never FAILs merely because no cyber tooling is
          # installed (see docs/cyber/architecture.md) — a stock CI
          # runner should always exit 0 here.
          serein cyber doctor
          serein cyber doctor --json | python -c "import json,sys; json.load(sys.stdin)"

      - name: Veil CLI smoke test
        run: |
          serein veil status
          serein veil capabilities
          serein veil capabilities --json | python -c "import json,sys; json.load(sys.stdin)"
          serein veil plan
          serein veil plan --json | python -c "import json,sys; json.load(sys.stdin)"
          serein veil plan tor
          serein veil plan workspace
          serein veil plan whonix
          # veil doctor never FAILs merely because no Tor/Whonix tooling
          # is installed (see docs/veil/architecture.md) — a stock CI
          # runner should always exit 0 here. No Tor daemon, network,
          # KVM, browser, root, or Whonix image is required.
          serein veil doctor
          serein veil doctor --json | python -c "import json,sys; json.load(sys.stdin)"

      - name: Focus CLI smoke test
        run: |
          serein focus status
          serein focus domains
          serein focus capabilities
          serein focus capabilities --json | python -c "import json,sys; json.load(sys.stdin)"
          serein focus plan balanced
          serein focus plan dev
          serein focus plan ai
          serein focus plan cyber
          serein focus plan private
          serein focus plan ai --json | python -c "import json,sys; json.load(sys.stdin)"
          serein focus transition --from ai --to cyber
          serein focus transition --from ai --to cyber --json | python -c "import json,sys; json.load(sys.stdin)"
          serein focus transition --from cyber --to private
          serein focus transition --from balanced --to ai
          # focus doctor never FAILs merely because no GPU/Tor/KVM/
          # container tooling is installed (see docs/focus/architecture.md)
          # - a stock CI runner should always exit 0 here. S6.5 has no
          # Apply engine: no GPU, Tor, KVM, containers, root, or network
          # is required, and no systemd/cgroup mutation ever occurs.
          serein focus doctor
          serein focus doctor --json | python -c "import json,sys; json.load(sys.stdin)"

      - name: Distribution CLI smoke test
        run: |
          # Read-only only - never fetches or builds (Section 78 of the
          # S7.0 contract). No multi-GB download happens in this job;
          # see iso-smoke.yml for the separate, manually-triggered real
          # ISO build/boot validation workflow.
          serein distribution status
          serein distribution inspect distribution/test-fixtures/extracted-tree-ok
          serein distribution inspect distribution/test-fixtures/extracted-tree-ok --json | python -c "import json,sys; json.load(sys.stdin)"

      - name: Installer CLI smoke test
        run: |
          # Read-only only (Section 23-24 of the S7.1 contract) - never
          # wipes/formats/mounts/partitions/installs anything. No real
          # target-disk installation happens in this job; see
          # installer-smoke.yml for the separate, label-gated real
          # target-disk installer validation workflow.
          serein installer status
          serein installer disks
          serein installer disks --json | python -c "import json,sys; json.load(sys.stdin)"
          serein installer doctor
          serein installer doctor --json | python -c "import json,sys; json.load(sys.stdin)"
          # no disk exists to target on a stock CI runner - proves the
          # explicit-target requirement fails closed, never silently
          # picks a default.
          if serein installer plan --target /dev/does-not-exist; then
            echo "::error::installer plan unexpectedly succeeded with no real target"
            exit 1
          fi
